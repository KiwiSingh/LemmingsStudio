name: Windows Python rewrite
on:
  push:
    branches: ['rewrite/python-windows']
    paths: ['PythonStudio/**', 'Docs/PythonRewrite/**', '.github/workflows/python-rewrite.yml']
  pull_request:
    paths: ['PythonStudio/**', 'Docs/PythonRewrite/**', '.github/workflows/python-rewrite.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows-preview:
    runs-on: windows-2022
    timeout-minutes: 20
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - name: Redirect build caches to the runner temporary directory
        shell: pwsh
        run: |
          "PIP_CACHE_DIR=$env:RUNNER_TEMP/pip-cache" >> $env:GITHUB_ENV
          "PYINSTALLER_CONFIG_DIR=$env:RUNNER_TEMP/pyinstaller-cache" >> $env:GITHUB_ENV
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          architecture: 'x64'
      - name: Install the isolated Windows application and checks
        run: python -m pip install -c PythonStudio/requirements-lock.txt -e "./PythonStudio[test]" pyinstaller==6.22.3
      - name: Document integrity, rendering and workspace checks
        run: python -m pytest PythonStudio/tests -q --junitxml=python-test-results.xml
      - name: Build and smoke-test the standalone Windows preview
        shell: pwsh
        run: ./PythonStudio/build-windows.ps1 -OutputRoot "$env:RUNNER_TEMP/python-preview"
      - name: Include matching source and migration evidence
        shell: pwsh
        run: |
          $output = "$env:RUNNER_TEMP/python-preview/application"
          git archive --format=zip "--output=$output/Matching-Source.zip" HEAD PythonStudio Docs/PythonRewrite .github/workflows/python-rewrite.yml LICENSE THIRD_PARTY_NOTICES.md
          if ($LASTEXITCODE -ne 0) { throw 'Source archive failed.' }
          Copy-Item "$env:RUNNER_TEMP/python-preview/bundle-smoke.json" $output
          Copy-Item Docs/PythonRewrite/dependencies.json "$output/dependency-license-metadata.json"
          $sha = git rev-parse HEAD
          @{ commit=$sha; target='Windows x64'; macOSProduct='unchanged Swift application'; releaseStatus='experimental; full parity and distribution audit pending' } | ConvertTo-Json | Set-Content "$output/build-manifest.json"
      - uses: actions/upload-artifact@v4
        with:
          name: LemmingsStudio-Windows-Python-Preview
          path: ${{ runner.temp }}/python-preview/application/
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Windows-Python-validation
          path: |
            python-test-results.xml
            ${{ runner.temp }}/python-preview/bundle-smoke.json
          if-no-files-found: ignore
