name: Mac and Windows parity contracts
on:
  push:
    branches: ['rewrite/python-windows']
    paths: ['Sources/**', 'PythonStudio/**', 'Tests/ProjectCompatibility/**', '.github/workflows/parity-contract.yml']
  pull_request:
    paths: ['Sources/**', 'PythonStudio/**', 'Tests/ProjectCompatibility/**', '.github/workflows/parity-contract.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  mac-reference:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Compile actual Swift models and render original instrument references
        env:
          LEMMINGS_TEST_OUTPUT: ${{ runner.temp }}/parity-reference
        run: sh Tests/ProjectCompatibility/run.sh
      - name: Exercise actual Swift and Python document round trip
        env:
          LEMMINGS_TEST_OUTPUT: ${{ runner.temp }}/parity-reference
          PYTHONPATH: PythonStudio/src
        run: python Tests/ProjectCompatibility/round_trip.py
      - uses: actions/upload-artifact@v4
        with:
          name: Mac-parity-reference
          path: |
            ${{ runner.temp }}/parity-reference/*.lemmingsproject
            ${{ runner.temp }}/parity-reference/workspace-reference.json
            ${{ runner.temp }}/parity-reference/drum-reference/
            ${{ runner.temp }}/parity-reference/instrument-reference/
            ${{ runner.temp }}/parity-reference/effect-reference/
            ${{ runner.temp }}/parity-reference/warp-reference/
            ${{ runner.temp }}/parity-reference/noise-oracle.json
          if-no-files-found: error
  windows-native:
    needs: mac-reference
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          architecture: x64
      - uses: actions/download-artifact@v4
        with:
          name: Mac-parity-reference
          path: ${{ runner.temp }}/parity-reference
      - name: Install pinned checks and build native DSP
        shell: pwsh
        run: |
          python -m pip install -c PythonStudio/requirements-lock.txt -e "./PythonStudio[test]"
          if ($LASTEXITCODE -ne 0) { throw 'Dependency installation failed' }
          cmake -S PythonStudio/native -B "$env:RUNNER_TEMP/native-audio" -A x64
          if ($LASTEXITCODE -ne 0) { throw 'Native configure failed' }
          cmake --build "$env:RUNNER_TEMP/native-audio" --config Release
          if ($LASTEXITCODE -ne 0) { throw 'Native build failed' }
      - name: Compare native Windows DSP against actual Mac renders
        shell: pwsh
        run: |
          $env:QT_QPA_PLATFORM='offscreen'
          $env:LEMMINGS_NATIVE_LIBRARY="$env:RUNNER_TEMP/native-audio/Release/lemmings_audio.dll"
          $env:LEMMINGS_SWIFT_FIXTURE="$env:RUNNER_TEMP/parity-reference/swift.lemmingsproject"
          $env:LEMMINGS_SWIFT_DRUM_REFERENCE="$env:RUNNER_TEMP/parity-reference/drum-reference"
          $env:LEMMINGS_SWIFT_INSTRUMENT_REFERENCE="$env:RUNNER_TEMP/parity-reference/instrument-reference"
          $env:LEMMINGS_SWIFT_EFFECT_REFERENCE="$env:RUNNER_TEMP/parity-reference/effect-reference"
          $env:LEMMINGS_SWIFT_WARP_REFERENCE="$env:RUNNER_TEMP/parity-reference/warp-reference"
          python -m pytest PythonStudio/tests -q --junitxml=parity-results.xml
          if ($LASTEXITCODE -ne 0) { throw 'Parity comparison failed' }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Windows-native-parity-results
          path: parity-results.xml
          if-no-files-found: error
